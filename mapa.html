    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
        }
        #map {
            height: 100%; /* Ocupa toda la pantalla */
            width: 100%;
        }

        #audioPlayer {
    display: none; /* Oculta el reproductor */
}

footer {
    border-top: 2px solid #00ff00; /* Borde superior */
    background-color: #000;    /* Fondo del pie de página */
    color: #fff;               /* Color del texto */
    padding: 10px 0;             /* Espaciado interno */
}

footer p {
    font-size: 1.2rem; /* Tamaño del texto */
    display: flex;
    justify-content: center; /* Centrar el contenido */
    align-items: center;     /* Centrar verticalmente */
    gap: 10px;               /* Espacio entre iconos y texto */
}

footer img {
    width: 24px; /* Tamaño de los iconos */
    height: 24px;
}

</head>

    <nav class="navbar navbar-expand-lg navbar-dark bg-black">

                            <li><a class="dropdown-item" href="flukeman.html">Flukeman</a></li>

    <!-- Reproductor de música -->
    <audio id="audioPlayer" autoplay loop>
        <source src="Audio/Materia Primoris_ The X-Files Theme (Main Title).mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>


    <div id="map"></div>

    <footer class="mt-auto text-center">
        <p class="mb-0">
            <!-- Imagen al principio -->
            <img src="Images/Logo.ico" alt="Alien Icono">
            La verdad está ahí afuera
            <!-- Imagen al final -->
            <img src="Images/Logo.ico" alt="Alien Icono">
        </p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

document.addEventListener("DOMContentLoaded", function() {
    const audio = document.getElementById("audioPlayer");
    audio.volume = 0.5;
    audio.play().catch(error => console.error("La reproducción automática fue bloqueada:", error));
});
        // Inicialización del mapa
        const map = L.map('map').setView([37.7749, -122.4194], 4);

        // Capa de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Marcadores de monstruos
    L.marker([40.0583, -74.4057]).addTo(map).bindPopup("Flukeman avistado en Nueva Jersey.").openPopup();
    L.marker([34.3704, -86.9158]).addTo(map).bindPopup("Falkville Metal Man avistado en Falkville.").openPopup();
    L.marker([38.8454, -82.1383]).addTo(map).bindPopup("Mothman avistado en Point Pleasant.").openPopup();
    L.marker([38.7858, -77.3149]).addTo(map).bindPopup("Bunnyman avistado en Fairfax County.").openPopup();
    L.marker([37.7749, -122.4194]).addTo(map).bindPopup("Hatman avistado en San Francisco.").openPopup();
    L.marker([42.2518, -71.2826]).addTo(map).bindPopup("Demon Dover avistado en Dover.").openPopup();
    </script>
